# Vapor: kitty colors matching the SteamOS Vapor Konsole scheme (Vapor.colorscheme),
# the Vapor Plasma color scheme and alacritty/vapor.toml (same values).
# normal = Konsole ColorN, bright = ColorNIntense. kitty has no faint palette; it
# fades text by dim_opacity instead.
# Selection, marks, tabs and hints use the Vapor Plasma selection/focus colors.
# Konsole's 0.9 opacity is a window setting, so set background_opacity in kitty.conf.
#
# Use: include /usr/share/kitty/themes/steamos-vapor.conf near the top of
# kitty.conf. The hint shortcuts at the end replace kitty's default ones, so put
# your own maps for those keys after the include.

foreground              #eff0f1
background              #151b21
selection_foreground    #1f1f26
selection_background    #569fcc
cursor                  #eff0f1
cursor_text_color       #151b21
url_color               #3daee9

# normal
color0  #4d5761
color1  #ed1515
color2  #7ea64b
color3  #f67400
color4  #1d99f3
color5  #9b59b6
color6  #e3ffc2
color7  #eff0f1

# bright
color8  #7f8c8d
color9  #c0392b
color10 #6eb63f
color11 #fdbc4b
color12 #3daee9
color13 #8e44ad
color14 #8dbd55
color15 #fcfcfc

# split borders
active_border_color     #569fcc
inactive_border_color   #31363b
bell_border_color       #fdbc4b

# tab bar
tab_bar_background      #151b21
active_tab_foreground   #1f1f26
active_tab_background   #569fcc
inactive_tab_foreground #dce6e7
inactive_tab_background #31363b

# marks (mark1/2/3 highlight commands): Vapor selection blue, hint yellow, purple
mark1_foreground #1f1f26
mark1_background #569fcc
mark2_foreground #1f1f26
mark2_background #fdbc4b
mark3_foreground #1f1f26
mark3_background #9b59b6

# Hint labels, matching Alacritty's [colors.hints.start] (kitty's default is black
# on green). The hints kitten only takes colors as arguments, so these redefine
# kitty's default hint shortcuts with the Vapor colors.
action_alias vapor_hints kitten hints --hints-foreground-color=#1f1f26 --hints-background-color=#fdbc4b --hints-text-color=#569fcc
map ctrl+shift+e     vapor_hints --type url
map ctrl+shift+p>f   vapor_hints --type path --program -
map ctrl+shift+p>shift+f vapor_hints --type path
map ctrl+shift+p>l   vapor_hints --type line --program -
map ctrl+shift+p>w   vapor_hints --type word --program -
map ctrl+shift+p>h   vapor_hints --type hash --program -
map ctrl+shift+p>n   vapor_hints --type linenum
map ctrl+shift+p>y   vapor_hints --type hyperlink
